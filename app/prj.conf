CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_SSD1306=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_WINBOND_W25Q128=y
CONFIG_LED_STRIP=y
CONFIG_PWM=y
CONFIG_BUZZER=y
CONFIG_BUZZER_PWM=y
CONFIG_DMA=y
CONFIG_CUSTOM_WS2812=y
CONFIG_LOG=y
CONFIG_TDK_MPU6050=y
CONFIG_QST_QMC5883L=y
CONFIG_SENSIRION_SHT30=y
CONFIG_BOSCH_BMP280=y
CONFIG_QINYUE_KT6368A=y
CONFIG_I2C_GPIO=y
# SD 卡:SDMMC 主机控制器(ST 原生驱动)+ FAT 文件系统,挂载点 "/SD:"
CONFIG_SDMMC_STM32=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# 新版 FATFS(ChaN 2025)按字符串卷名解析挂载点,FF_VOLUMES/卷名表都由
# 下面两项生成;不注册时 f_mount("/SD:") 直接返回 FR_INVALID_DRIVE(-19)
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="SD"
# 长文件名(LFN):8.3 格式之外的文件名(超 8 字符/含扩展名点号/中文)
# 才能按原名访问;工作缓冲约多占 0.5KB RAM。代码页 437 下中文名可
# 列出但会显示乱码,需完美支持再改 CONFIG_FS_FATFS_CODEPAGE=936
CONFIG_FS_FATFS_LFN=y
# F401 带单精度硬件 FPU,姿态解算是浮点运算,不开 FPU 会走软件模拟,慢一个数量级
CONFIG_FPU=y
# printk/LOG 支持 %f 浮点输出(姿态角打印用)
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PICOLIBC_IO_FLOAT=y
# SD/MMC 协议栈 + FATFS 挂载路径栈开销较大,主线程栈加大一倍
CONFIG_MAIN_STACK_SIZE=2048
