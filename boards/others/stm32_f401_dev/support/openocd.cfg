source [find interface/cmsis-dap.cfg]
transport select swd

# Use a conservative work area size for flash programming
set WORKAREASIZE 0x8000

source [find target/stm32f4x.cfg]

reset_config srst_only
adapter speed 5000

# Keep SWD speed low during flash programming, but still run the
# default STM32F4 PLL/flash-latency setup from target/stm32f4x.cfg.
$_TARGETNAME configure -event reset-init {
	mww 0x40023804 0x08012008   ;# RCC_PLLCFGR
	mww 0x40023C00 0x00000102   ;# FLASH_ACR
	mmw 0x40023800 0x01000000 0 ;# RCC_CR |= PLLON
	sleep 10
	mmw 0x40023808 0x00001000 0 ;# RCC_CFGR |= PPRE1_DIV2
	mmw 0x40023808 0x00000002 0 ;# RCC_CFGR |= SW_PLL
	adapter speed 5000
}

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}
